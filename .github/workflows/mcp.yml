name: MCP tests
on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'monitor/schemas/**'
      - 'mcp.config.json'
      - 'rules/agent-threats/model-security/**'
      - 'tests/mcp/**'
      - 'tests/mcp.test.js'
jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
