id: xss-php-001
title: Reflected XSS via Unsanitized PHP Output
severity: high
category: appsec
detection_tier: regex
scope: language-specific
maps_to:
  owasp:
    - A03:2021
  cwe:
    - CWE-79
detection:
  file_patterns:
    - '**/*.php'
  scope: line
  logic: OR
  conditions:
    - pattern: echo\s+\$_(?:GET|POST|REQUEST|COOKIE)\s*\[
      description: echo directly outputting a superglobal value
    - pattern: print\s+\$_(?:GET|POST|REQUEST|COOKIE)\s*\[
      description: print directly outputting a superglobal value
    - pattern: echo\s+\$_(?:GET|POST|REQUEST|COOKIE)\['[^']*'\]
      description: echo outputting a named superglobal key
    - pattern: <\?=\s*\$_(?:GET|POST|REQUEST|COOKIE)
      description: Short echo tag outputting superglobal
description: |
  Detects PHP code that directly outputs superglobal values ($_GET, $_POST, $_REQUEST, $_COOKIE) using echo, print, or short echo tags (<?=) without any apparent escaping function. False-positive surface is low: direct superglobal output without htmlspecialchars or similar is almost always unsafe.
  In PHP, outputting user-controlled values directly to HTML without escaping allows injected script tags or event handlers to execute in the victim's browser (reflected XSS). Note that Blade templates ({{ $var }}) and Twig's {{ var }} auto-escape by default and are not covered by this rule.
remediation: 'Wrap all user-controlled output in htmlspecialchars(): echo htmlspecialchars($_GET[''name''], ENT_QUOTES, ''UTF-8''). For Laravel/Blade, use {{ $var }} (auto-escaped) rather than {!! $var !!}.'
ai_guidance:
  watch_for:
    - Blade template {{ $var }} syntax auto-escapes and is safe; only {!! $var !!} is vulnerable.
    - Twig's {{ var }} also auto-escapes by default.
    - echo of a superglobal that has already been passed through htmlspecialchars() or filter_input() earlier in the request lifecycle may produce a false positive.
  references:
    - title: OWASP Top 10:2021 A03 - Injection
      url: https://owasp.org/Top10/A03_2021-Injection/
    - title: PHP htmlspecialchars()
      url: https://www.php.net/manual/en/function.htmlspecialchars.php
  related_rule_ids:
    - xss-reflected-js-001
    - xss-innerHTML-001
test_cases:
  - type: true_positive
    fixture: vulnerable.php
    description: Direct echo of GET parameter without escaping
    code: |
      <?php
      echo $_GET['name'];
  - type: true_negative
    fixture: safe.php
    description: GET parameter escaped with htmlspecialchars
    code: |
      <?php
      echo htmlspecialchars($_GET['name'], ENT_QUOTES, 'UTF-8');
