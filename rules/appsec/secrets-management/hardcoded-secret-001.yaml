id: hardcoded-secret-001
title: Hardcoded Secret Detected
severity: critical
category: secrets-management
detection_tier: regex
scope: language-agnostic
maps_to:
  owasp:
    - A07:2021
  pdpa: "Section 25, Personal Data Protection Act 2010 (as amended)"
detection:
  extensions:
    - ".js"
    - ".ts"
  scope: line
  logic: OR
  conditions:
    - pattern: "(api[_-]?key|secret|password|token|credential)(?:[^=]{0,20})?=\\s*['\"]([^'\"]{8,})['\"]"
      flags: "i"
      description: "Variable name suggests a secret; RHS is a quoted string of 8+ chars"
  entropy_check:
    min_bits_per_char: 3.5
    or_prefixes:
      - "sk_live_"
      - "ghp_"
      - "AKIA"
      - "xoxb-"
description: >
  Detects string literals assigned to variables whose names suggest they hold a secret
  (api_key, apiKey, secret, password, token, credential, etc.) where the value is a
  quoted string of 8 or more characters. A secondary entropy check flags values with
  Shannon entropy ≥ 3.5 bits/char or a known secret-service prefix (sk_live_, ghp_,
  AKIA, xoxb-).

  The 3.5 bits/char threshold is empirically tuned against this project's fixture set,
  not a universal constant. Contributors adjusting this threshold must re-run the full
  fixture suite and note the change in the PR description.

  ponytail: entropy is computed in-engine (~5 lines of TS, no new dependency). Known
  ceiling: short high-entropy strings may produce false negatives. Upgrade path: add a
  dedicated secrets-scanning library in v0.2.
remediation: "Move secrets to environment variables or a secrets manager. Never commit credential values to source code."
ai_guidance:
  watch_for:
    - "Credential-shaped values assigned to unusual names such as auth_string or connKey."
    - "Encoded or transformed values near environment-variable loading code that may conceal a secret."
  references:
    - title: "OWASP Top 10:2021 A07 - Identification and Authentication Failures"
      url: "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
  related_rule_ids: ["hardcoded-llm-key-001"]
  reasoning_notes: "These watch items describe known regex blind spots and are not scanner findings."
test_cases:
  - type: true_positive
    fixture: "vulnerable.ts"
    description: "API key assigned as a string literal with high entropy"
    code: 'const apiKey = "FAKEsk_live_ABCDEF1234567890fake";'
  - type: true_negative
    fixture: "safe.ts"
    description: "API key loaded from process.env, not hardcoded"
    code: "const apiKey = process.env.API_KEY;"
