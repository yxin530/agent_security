id: secret-provider-prefix-001
title: Known Provider Token Format
severity: critical
category: secrets-management
confidence: high
detection_tier: regex
scope: language-agnostic
maps_to:
  owasp:
    - A07:2021
  pdpa: Section 25, Personal Data Protection Act 2010 (as amended)
detection:
  scope: line
  logic: OR
  conditions:
    - pattern: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{50,}\b'
      description: GitHub personal access token
    - pattern: '\bglpat-[A-Za-z0-9\-_]{20,}\b'
      description: GitLab personal access token
    - pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
      description: AWS Access Key ID
    - pattern: '\bxox[abprs]-[0-9A-Za-z\-_]{10,}\b'
      description: Slack token
    - pattern: '\b(?:sk|rk)_live_[0-9a-zA-Z]{24,}\b'
      description: Stripe live secret or restricted key
    - pattern: '\bAIza[0-9A-Za-z\-_]{35}\b'
      description: Google API key
    - pattern: '\bnpm_[A-Za-z0-9]{36}\b'
      description: npm access token
    - pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
      description: PEM private key header
description: |
  Detects well-known third-party credential formats without requiring variable assignment, including tokens for GitHub, GitLab, AWS, Slack, Stripe, Google, npm, and PEM private keys.
remediation: Revoke the exposed credential immediately and replace it with a newly generated one stored in an environment variable or secrets manager.
ai_guidance:
  watch_for:
    - Token values split across lines or concatenated from variables.
  references:
    - title: OWASP Top 10:2021 A07 - Identification and Authentication Failures
      url: https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  related_rule_ids:
    - secret-assignment-001
    - hardcoded-llm-key-001
  reasoning_notes: High confidence regex anchored with word boundaries.
detection_limitations: Will not match tokens with custom prefixes or modified formats.
test_cases:
  - type: true_positive
    fixture: tp-github.ts
    description: GitHub classic PAT
    code: const token = "ghp_FAKE12345678901234567890123456789012";
  - type: true_positive
    fixture: tp-gitlab.ts
    description: GitLab token
    code: const token = "glpat-FAKE1234567890123456";
  - type: true_positive
    fixture: tp-aws.ts
    description: AWS Access Key ID
    code: const keyId = "AKIAFAKE1234567890";
  - type: true_positive
    fixture: tp-slack.ts
    description: Slack token
    code: const token = "xoxb-FAKE1234567890";
  - type: true_positive
    fixture: tp-stripe.ts
    description: Synthetic Stripe key prefix fixture
    code: const stripeKey = "sk_live_{{FAKE:24}}";
  - type: true_positive
    fixture: tp-google.ts
    description: Google API key
    code: const gKey = "AIzaFAKE123456789012345678901234567";
  - type: true_positive
    fixture: tp-npm.ts
    description: npm access token
    code: const npmToken = "npm_FAKE1234567890123456789012345678";
  - type: true_positive
    fixture: tp-pem.ts
    description: PEM private key header
    code: "-----BEGIN RSA PRIVATE KEY-----\nFAKE_EXAMPLE\n-----END RSA PRIVATE KEY-----"
  - type: true_negative
    fixture: tn.ts
    description: Safe environment variable lookup
    code: const token = process.env.API_TOKEN;
  - type: true_negative
    fixture: tn-nearmiss.ts
    description: Near miss token formats
    code: const ghp_short = "ghp_123";
