id: secret-assignment-001
title: Hardcoded Secret Assignment Detected
severity: critical
category: secrets-management
confidence: high
detection_tier: regex
scope: language-agnostic
maps_to:
  owasp:
    - A07:2021
  pdpa: Section 25, Personal Data Protection Act 2010 (as amended)
detection:
  scope: line
  logic: OR
  conditions:
    - pattern: '["'']?(?:api[_-]?key|secret|password|token|credential|auth[_-]?token)["'']?(?:[^=,\r\n]{0,25})?(?:=>|=|:)\s*[''"]([^''"\r\n]{8,})[''"]'
      flags: i
      description: Secret-like identifier assigned a quoted literal
    - pattern: '^\s*["'']?(?:api[_-]?key|secret|password|token|credential|auth[_-]?token|[A-Z0-9_]*(?:KEY|SECRET|TOKEN|PASSWORD))[A-Z0-9_]*["'']?\s*=\s*([^''"\s#\r\n]{8,})'
      flags: i
      description: Secret-like variable assigned an unquoted literal in dotenv or configuration
  entropy_check:
    min_bits_per_char: 3.0
    or_prefixes:
      - sk_live_
      - ghp_
      - AKIA
      - xoxb-
      - FAKE
      - EXAMPLE
description: |
  Detects string literals assigned to variables whose names suggest they hold a secret (api_key, apiKey, secret, password, token, credential, etc.) where the value is a quoted string of 8 or more characters, or unquoted in dotenv files. Includes an entropy check.
remediation: Move secrets to environment variables or a secrets manager. Never commit credential values to source code.
ai_guidance:
  watch_for:
    - Credential-shaped values assigned to unusual names such as auth_string or connKey.
  references:
    - title: OWASP Top 10:2021 A07 - Identification and Authentication Failures
      url: https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  related_rule_ids:
    - hardcoded-llm-key-001
    - secret-provider-prefix-001
  reasoning_notes: Regex heuristics may not catch dynamic assignments or obfuscated values.
detection_limitations: Static regex checks cannot analyze runtime data flow.
test_cases:
  - type: true_positive
    fixture: vulnerable.ts
    description: API key assigned as a string literal with FAKE prefix
    code: const apiKey = "FAKEsk_live_ABCDEF1234567890fake";
  - type: true_negative
    fixture: safe.ts
    description: API key loaded from process.env, not hardcoded
    code: const apiKey = process.env.API_KEY;
  - type: true_positive
    fixture: tp-obj.ts
    description: Object literal with apiKey property
    code: 'const config = { apiKey: "FAKE_EXAMPLE_SECRET_KEY_12345" };'
  - type: true_positive
    fixture: tp-json.json
    description: JSON property with secret value
    code: '{ "api_key": "FAKE_EXAMPLE_SECRET_KEY_12345" }'
  - type: true_positive
    fixture: tp.env
    description: Unquoted dotenv assignment
    code: API_KEY=FAKE_EXAMPLE_SECRET_KEY_12345
  - type: true_positive
    fixture: tp-php.php
    description: PHP associative array secret assignment
    code: "$config = ['api_key' => 'FAKE_EXAMPLE_SECRET_KEY_12345'];"
  - type: true_positive
    fixture: tp-constructor.ts
    description: Constructor invocation with apiKey option
    code: 'const client = new Client({ apiKey: "FAKE_EXAMPLE_SECRET_KEY_12345" });'
  - type: true_positive
    fixture: vulnerable.cs
    description: C# const string ApiKey
    code: class Config { private const string ApiKey = "sk_live_FAKE_A1b2C3d4E5f6G7h8"; }
  - type: true_negative
    fixture: safe.cs
    description: C# safe environment variable
    code: class Config { private string ApiKey = Environment.GetEnvironmentVariable("API_KEY"); }
  - type: true_positive
    fixture: vulnerable.java
    description: Java static final String API_KEY
    code: class Config { private static final String API_KEY = "sk_live_FAKE_A1b2C3d4E5f6G7h8"; }
  - type: true_negative
    fixture: safe.java
    description: Java safe environment variable
    code: class Config { private String apiKey = System.getenv("API_KEY"); }
  - type: true_positive
    fixture: vulnerable.rb
    description: Ruby API_KEY assignment
    code: API_KEY = "sk_live_FAKE_A1b2C3d4E5f6G7h8"
  - type: true_negative
    fixture: safe.rb
    description: Ruby safe environment variable
    code: API_KEY = ENV["API_KEY"]
  - type: true_positive
    fixture: vulnerable.rs
    description: Rust API_KEY constant
    code: 'const API_KEY: &str = "sk_live_FAKE_A1b2C3d4E5f6G7h8";'
  - type: true_negative
    fixture: safe.rs
    description: Rust safe environment variable
    code: let api_key = std::env::var("API_KEY");
