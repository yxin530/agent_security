id: sql-injection-php-001
title: "SQL Injection via PHP String Concatenation"
severity: high
category: injection
detection_tier: regex
scope: language-specific
maps_to:
  owasp: ["A03:2021"]
detection:
  file_patterns: ["**/*.php"]
  extensions: [".php"]
  scope: line
  logic: OR
  conditions:
    - pattern: '(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE)\s+.+["'']\s*\.\s*\$[a-zA-Z_]\w*'
      flags: "i"
    - pattern: '"(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE)\s+[^"\n]*\$[a-zA-Z_]\w*'
      flags: "i"
description: "Detects SQL strings concatenated with PHP variables or interpolated into double-quoted SQL strings."
remediation: "Use parameterised queries or an ORM instead of interpolating request data into SQL."
ai_guidance:
  watch_for: ["Query builders or helper methods that concatenate request data across multiple lines."]
  references:
    - { title: "OWASP Top 10:2021 A03 - Injection", url: "https://owasp.org/Top10/A03_2021-Injection/" }
  related_rule_ids: ["sql-injection-js-001", "sql-injection-go-001"]
  reasoning_notes: "This regex does not model PHP data flow across function boundaries."
test_cases:
  - type: true_positive
    fixture: "vulnerable.php"
    description: "PHP SQL string concatenates a variable"
    code: '$q = "SELECT * FROM users WHERE id = " . $userId;'
  - type: true_negative
    fixture: "safe.php"
    description: "PHP query uses a placeholder"
    code: '$db->query("SELECT * FROM users WHERE id = ?", [$userId]);'
