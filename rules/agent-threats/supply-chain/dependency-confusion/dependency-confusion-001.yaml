id: dependency-confusion-001
title: "Dependency Confusion (Supply Chain Naming Collision)"
severity: high
category: agent-threats
scope: language-specific
detection_tier: regex
ai_guidance:
  watch_for:
    - "A match indicates a naming-collision risk shape, not confirmed malicious intent. The package in question may be legitimately public."
    - "Verify if the unscoped package name is actually an internal project missing its proper @scope prefix."
  references:
    - title: "NPM Dependency Confusion"
      url: "https://dhiyaneshgeek.github.io/web/security/2021/09/04/dependency-confusion/"
  related_rule_ids: []
maps_to:
  owasp:
    - "A08:2021"
  owasp_llm: "LLM03:2025"
  atlas: "AML.T0043"
detection:
  extensions: [".json", ".js", ".ts"]
  file_patterns: ["package.json", "*.js", "*.ts"]
  scope: file
  logic: OR
  conditions:
    - pattern: '"(?:dependencies|devDependencies)"\s*:\s*\{[^}]*"(?!@)[a-zA-Z0-9\-_]*(?:internal|private|corp|company)[a-zA-Z0-9\-_]*"\s*:'
      flags: "i"
      description: "Detects internal-sounding, unscoped package names in dependencies"
    - pattern: '(?:require\(|import\s+.*\s+from\s+)[\'"](?!@)[a-zA-Z0-9\-_]*(?:internal|private|corp|company)[a-zA-Z0-9\-_]*[\'"]'
      flags: "i"
      description: "Detects internal-sounding, unscoped bare package imports"
description: |
  Detects an unscoped package name in package.json dependencies/devDependencies or a bare require/import that matches an internal-sounding pattern but lacks an organization scope (e.g., `@myorg/`).
  This code shape is vulnerable to dependency confusion, where an attacker registers a malicious package with the same name on the public npm registry, causing automated tools to download the public package instead of the internal one.
remediation: |
  Ensure all internal packages are published under a registered, private organization scope (e.g., `@mycompany/internal-pkg`). Alternatively, configure your package manager to strictly route specific package names to your internal registry.
test_cases:
  - type: true_positive
    description: "unscoped internal-sounding package name in dependencies"
    fixture: |
      {
        "dependencies": {
          "acme-internal-utils": "^1.0.0"
        }
      }
  - type: true_negative
    description: "properly scoped package"
    fixture: |
      {
        "dependencies": {
          "@acme/internal-utils": "^1.0.0"
        }
      }
