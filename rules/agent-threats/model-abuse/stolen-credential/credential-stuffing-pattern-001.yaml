id: credential-stuffing-pattern-001
title: "Credential Stuffing Loop Pattern"
severity: medium
category: model-abuse
detection_tier: regex
scope: language-specific
maps_to:
  owasp: ["A07:2021"]
  owasp_llm: ["LLM10:2025"]
  atlas: "AML.T0043"
detection:
  file_patterns: ["**/*.js", "**/*.ts"]
  extensions: [".js", ".ts"]
  scope: line
  logic: AND
  conditions:
    - pattern: '(for|while|forEach|map)\s*\([\s\S]*?(creds?|credential|combo|username.*password)'
      flags: "i"
    - pattern: '(fetch|axios|http\.request|requests\.(get|post))[\s\S]*?(login|auth|signin)'
      flags: "i"
    - pattern: '(/test/|/tests/|/__tests__/|/spec/|\.test\.(js|ts)|\.spec\.(js|ts))'
      flags: "i"
      negate: true
description: "Detects a recognizable code shape often used for credential stuffing: a loop iterating over a credential list that issues HTTP requests to an authentication endpoint. Note: A match indicates a recognizable code shape, not necessarily confirmed malicious intent."
remediation: "Verify the intent of the loop. If legitimate, ensure it runs against authorized test environments only. Do not deploy credential stuffing tools to production."
ai_guidance:
  watch_for:
    - "Matches indicate a recognizable code shape (a loop making auth requests), not necessarily malicious intent. Ensure this is not just legitimate testing code before making a determination."
  references:
    - title: "OWASP API Security: Unrestricted Resource Consumption"
      url: "https://owasp.org/API-Security/editions/2023/en/0x11-t10/"
  related_rule_ids: []
test_cases:
  - { type: true_positive, fixture: vulnerable.ts, description: "Iterates over credentials and posts to login", code: "credentials.forEach(cred => { axios.post('/api/login', cred); });" }
  - { type: true_negative, fixture: safe.ts, description: "Single login call, no loop", code: "axios.post('/api/login', { username, password });" }
  - { type: true_negative, fixture: test-vulnerable.spec.ts, description: "Excluded test file via path string in code", code: "// /test/ credentials.forEach(cred => { axios.post('/api/login', cred); });" }
