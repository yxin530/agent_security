id: missing-tool-auth-001
title: "Missing MCP Tool Authorization"
severity: high
category: model-security
detection_tier: regex
scope: language-agnostic
maps_to: { owasp: ["A05:2021"], owasp_llm: "LLM06:2025", atlas: "AML.T0048" }
detection: { extensions: [".ts", ".js"], scope: line, logic: AND, conditions: [{ pattern: "registerTool|tool\\(", flags: "i" }, { pattern: "authorize|authenticate|requireAuth|ctx\\.user", flags: "i", negate: true }] }
description: "Detects tool registration without a visible authorization control."
remediation: "Require authentication and per-tool authorization before dispatch."
test_cases: [{ type: true_positive, fixture: vulnerable.ts, description: "Tool has no authorization guard" }, { type: true_negative, fixture: safe.ts, description: "Tool checks authorization" }]
