id: sensitive-data-in-resources-001
title: Sensitive Data Exposed by MCP Resource
severity: high
category: model-security
detection_tier: regex
scope: language-agnostic
maps_to:
  owasp:
    - A09:2021
  owasp_llm:
    - LLM06:2025
  atlas: AML.T0048
detection:
  scope: line
  logic: AND
  conditions:
    - pattern: registerResource|resource\(
      flags: i
    - pattern: (password|token|secret|privateKey|ssn|icNumber)
      flags: i
    - pattern: redact|mask|authorize|scope
      flags: i
      negate: true
description: Detects sensitive values exposed through a resource without visible protection.
remediation: Minimize resource data and enforce authorization and redaction.
test_cases:
  - type: true_positive
    fixture: vulnerable.ts
    description: Resource returns a secret
  - type: true_negative
    fixture: safe.ts
    description: Resource redacts sensitive data
confidence: heuristic
detection_limitations: As a regex-based heuristic, this rule cannot perform data-flow analysis. It may produce false negatives if variables are reassigned or obfuscated, and false positives if safe wrapper functions or benign logging are used on the same line.
