id: missing-audit-logging-001
title: Missing MCP Audit Logging
severity: medium
category: model-security
detection_tier: regex
scope: language-agnostic
maps_to:
  owasp:
    - A09:2021
  owasp_llm:
    - LLM06:2025
  atlas: AML.T0048
detection:
  extensions:
    - .ts
    - .js
  scope: line
  logic: AND
  conditions:
    - pattern: registerTool|tool\(
      flags: i
    - pattern: audit|logger|logToolCall|appendFile
      flags: i
      negate: true
description: Detects tool registration without visible audit logging.
remediation: Record structured, redacted tool invocation outcomes locally.
test_cases:
  - type: true_positive
    fixture: vulnerable.ts
    description: Tool has no audit call
  - type: true_negative
    fixture: safe.ts
    description: Tool records an audit event
confidence: heuristic
detection_limitations: As a regex-based heuristic, this rule cannot perform data-flow analysis. It may produce false negatives if variables are reassigned or obfuscated, and false positives if safe wrapper functions or benign logging are used on the same line.
