id: agent-credential-exposure-001
title: Agent Tool Call Includes Raw Credentials in Arguments
severity: high
category: sensitive-data
detection_tier: regex
scope: language-specific
maps_to:
  owasp:
    - A07:2021
  owasp_llm:
    - LLM02:2025
    - LLM06:2025
  cwe:
    - CWE-200
    - CWE-522
detection:
  file_patterns:
    - '**/*.js'
    - '**/*.ts'
    - '**/*.py'
  scope: line
  logic: AND
  conditions:
    - pattern: (callTool|invokeTool|executeTool|tool\.run|tool\.invoke|agent\.run|runTool|call_tool|invoke_tool)\s*\(.*?(api[_-]?key|secret|password|token|credential|bearer|auth[_-]?header)
      flags: i
      description: Agent tool invocation passes a recognizable credential field as an argument
    - pattern: (vault|getSecret|fetchSecret|secretManager|sealed|encrypted|kms|hsm|getCredential)
      flags: i
      negate: true
      description: Negated — no visible secrets-manager retrieval on the same line
description: |
  Detects agent tool invocations where a recognizable credential field name (api_key, password, token, bearer, auth_header, etc.) appears directly in the tool call arguments without evidence of a secrets-manager or vault retrieval on the same line. Passing raw credentials as tool arguments exposes them in logs, traces, and any intermediate agent state visible to the model.
  Distinct from hardcoded-llm-key-001 (which detects literal string assignments) and pii-in-logs-* (which detects log output).
remediation: |
  Retrieve credentials from a vault or secrets manager at the point of use and avoid placing them in tool argument objects visible to the model:
    // TypeScript — inject credentials via environment or vault, not as tool args
    const creds = await vault.getSecret('api-key');
    await callTool('externalApi', { url, headers: { Authorization: `Bearer ${creds}` } });
    # Python
    secret = secretManager.get_secret("api-key")
    call_tool("external_api", {"url": url, "auth": secret})
ai_guidance:
  watch_for:
    - Agent orchestration frameworks (LangChain, AutoGPT, CrewAI) that log tool arguments including credential fields.
    - Multi-agent pipelines where credentials are forwarded from one agent to another via tool arguments.
    - Tool argument objects that include entire environment variable maps containing mixed sensitive and non-sensitive keys.
  references:
    - title: OWASP LLM02:2025 - Sensitive Information Disclosure
      url: https://genai.owasp.org/llmrisk/llm02-sensitive-information-disclosure/
    - title: OWASP LLM06:2025 - Excessive Agency
      url: https://genai.owasp.org/llmrisk/llm06-excessive-agency/
  related_rule_ids:
    - embedding-sensitive-data-001
    - hardcoded-secret-001
    - hardcoded-llm-key-001
  reasoning_notes: Detects recognizable credential field names in tool invocation arguments only. Credentials stored in opaque variable names are not visible to this rule.
detection_limitations: As a line-scope regex heuristic, this rule cannot perform data-flow analysis. It may produce false negatives if the credential is in a variable with a non-sensitive name, and false positives if the value is already encrypted or tokenized before the call.
confidence: heuristic
test_cases:
  - type: true_positive
    fixture: vulnerable.ts
    description: Agent passes raw API key as a tool argument
    code: 'await callTool("send_request", { url, apiKey: process.env.API_KEY });'
  - type: true_negative
    fixture: safe.ts
    description: Agent retrieves credential from vault before tool call
    code: 'const secret = await vault.getSecret("api-key"); await callTool("send_request", { url, auth: secret });'
  - type: true_positive
    fixture: vulnerable.py
    description: Python agent passes password in tool invocation
    code: 'call_tool("db_query", {"host": host, "password": db_password})'
  - type: true_negative
    fixture: safe.py
    description: Python agent uses sealed credential from secrets manager
    code: 'cred = secretManager.get_secret("db-password"); call_tool("db_query", {"host": host, "auth": cred})'
